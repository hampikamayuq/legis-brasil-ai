name: Remote MCP verification

on:
  pull_request:
    paths:
      - 'remote/**'
      - '.github/workflows/remote-mcp-ci.yml'
  push:
    branches: [main]
    paths:
      - 'remote/**'
      - '.github/workflows/remote-mcp-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build Worker without deploying
        run: npx wrangler deploy --dry-run --outdir ./dist-dryrun
